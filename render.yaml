services:
  # ── Backend (Node.js / Express) ─────────────────────────────────────────────
  - type: web
    name: sahi-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false          # Set this in the Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a strong secret
      - key: DEFAULT_SUPERADMIN_NAME
        sync: false
      - key: DEFAULT_SUPERADMIN_EMAIL
        sync: false
      - key: DEFAULT_SUPERADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false          # Set to your frontend Render URL, e.g. https://sahi-frontend.onrender.com
    healthCheckPath: /

  # ── Frontend (React + Vite → Static Site) ───────────────────────────────────
  - type: web
    name: sahi-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # Set to your backend Render URL, e.g. https://sahi-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
